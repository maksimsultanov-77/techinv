<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест местоположений</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result {
            margin-top: 10px;
            padding: 10px;
            background-color: #f5f5f5;
            border-radius: 5px;
        }
        .success {
            color: green;
        }
        .error {
            color: red;
        }
    </style>
</head>
<body>
    <h1>Тест функциональности местоположений</h1>
    
    <div class="test-section">
        <h2>1. Проверка системных местоположений</h2>
        <button onclick="checkSystemLocations()">Проверить системные местоположения</button>
        <div id="system-locations-result" class="result"></div>
    </div>

    <div class="test-section">
        <h2>2. Генерация тестовых местоположений</h2>
        <button onclick="generateTestLocations()">Сгенерировать тестовые местоположения</button>
        <div id="generate-result" class="result"></div>
    </div>

    <div class="test-section">
        <h2>3. Очистка местоположений</h2>
        <button onclick="clearLocations()">Очистить все местоположения</button>
        <div id="clear-result" class="result"></div>
    </div>

    <div class="test-section">
        <h2>4. Проверка после очистки</h2>
        <button onclick="checkAfterClear()">Проверить местоположения после очистки</button>
        <div id="after-clear-result" class="result"></div>
    </div>

    <script type="module">
        import { 
            initDatabase, 
            getAllLocations, 
            generateTestLocations, 
            clearAllLocations,
            isSystemLocation 
        } from './src/db/database.ts';

        let dbInitialized = false;

        async function ensureDbInitialized() {
            if (!dbInitialized) {
                await initDatabase();
                dbInitialized = true;
            }
        }

        window.checkSystemLocations = async function() {
            await ensureDbInitialized();
            const locations = getAllLocations();
            const systemLocations = locations.filter(loc => isSystemLocation(loc.id));
            
            const resultDiv = document.getElementById('system-locations-result');
            if (systemLocations.length === 2) {
                const names = systemLocations.map(l => l.name).join(', ');
                resultDiv.innerHTML = `<span class="success">✓ Найдено 2 системных местоположения: ${names}</span>`;
            } else {
                resultDiv.innerHTML = `<span class="error">✗ Ожидается 2 системных местоположения, найдено: ${systemLocations.length}</span>`;
            }
        };

        window.generateTestLocations = async function() {
            await ensureDbInitialized();
            const count = generateTestLocations();
            const locations = getAllLocations();
            
            const resultDiv = document.getElementById('generate-result');
            resultDiv.innerHTML = `<span class="success">✓ Создано ${count} новых местоположений. Всего: ${locations.length}</span>`;
        };

        window.clearLocations = async function() {
            await ensureDbInitialized();
            const result = clearAllLocations();
            
            const resultDiv = document.getElementById('clear-result');
            if (result.success) {
                resultDiv.innerHTML = `<span class="success">✓ ${result.message}</span>`;
            } else {
                resultDiv.innerHTML = `<span class="error">✗ ${result.message}</span>`;
            }
        };

        window.checkAfterClear = async function() {
            await ensureDbInitialized();
            const locations = getAllLocations();
            
            const resultDiv = document.getElementById('after-clear-result');
            if (locations.length === 2) {
                const names = locations.map(l => `${l.name} (ID: ${l.id})`).join(', ');
                resultDiv.innerHTML = `<span class="success">✓ После очистки осталось 2 местоположения: ${names}</span>`;
            } else {
                const details = locations.map(l => `${l.name} (ID: ${l.id}, системное: ${isSystemLocation(l.id)})`).join('<br>');
                resultDiv.innerHTML = `<span class="error">✗ Ожидается 2 местоположения, найдено: ${locations.length}<br><br>Детали:<br>${details}</span>`;
            }
        };
    </script>
</body>
</html>
